name: Update Profile

on:
  push:
    branches:
      - main
  workflow_dispatch:
  schedule:
    - cron: "0 0 * * *"

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          pip install -r scripts/requirements.txt

      - name: Generate heatmap
        run: |
          python scripts/make_heatmap.py

      - name: Generate info SVG
        run: |
          python scripts/make_info_svg.py

      - name: Generate ASCII SVG
        run: |
          python scripts/make_ascii_svg.py

      - name: Commit generated files
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add nikhil-heatmap.svg nikhil-info.svg nikhil-ascii.svg
          git diff --cached --quiet || git commit -m "Update profile assets"
          git push